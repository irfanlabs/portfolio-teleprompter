<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary SEO -->
    <title>Prompter Studio — Online Teleprompter with Video Recording</title>
    <meta
      name="description"
      content="Professional browser-based teleprompter with built-in video recording. Scroll your script at your pace, record in up to 4K, and download instantly — 100% private, nothing is uploaded."
    />
    <meta
      name="keywords"
      content="teleprompter, online teleprompter, video recorder, script prompter, autocue, record video with teleprompter, free teleprompter app"
    />
    <meta name="author" content="Prompter Studio" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prompter Studio" />
    <meta property="og:title" content="Prompter Studio — Online Teleprompter with Video Recording" />
    <meta
      property="og:description"
      content="Read your script and record studio-quality video right in the browser. Adjustable speed & size, up to 4K recording, instant download. Private by design."
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Prompter Studio — Online Teleprompter with Video Recording" />
    <meta
      name="twitter:description"
      content="Read your script and record studio-quality video right in the browser. Up to 4K, instant download, nothing uploaded."
    />

    <!-- Icons & manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Prompter Studio",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any (Web Browser)",
        "browserRequirements": "Requires a modern browser with camera access (Chrome, Edge, Safari, Firefox)",
        "description": "Professional browser-based teleprompter with built-in video recording. Scroll your script at your pace, record in up to 4K, and download instantly — nothing is uploaded.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Smooth auto-scrolling script overlay with adjustable speed and text size",
          "Camera and microphone recording up to 4K",
          "Mirrored preview for teleprompter rigs",
          "Instant local download — no uploads, no account",
          "Camera, microphone and quality selection"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
